<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINGO — 楽SAKEターミナル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: hidden; }
  body { font-family: "Noto Sans JP", sans-serif; background: #0f0e0c; color: #f5f2ea; min-height: 100vh; padding: 24px; position: relative; }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: radial-gradient(circle at 20% 10%, rgba(220, 38, 38, 0.08), transparent 50%),
                      radial-gradient(circle at 85% 80%, rgba(217, 119, 6, 0.08), transparent 50%);
    pointer-events: none; z-index: 0;
  }
  .app { max-width: 1100px; margin: 0 auto; position: relative; z-index: 2; }
  .app.hidden { display: none; }
  body.view-mode .host-only { display: none !important; }
  body.view-mode .range { cursor: default; }
  body.view-mode .range:hover { border-color: rgba(245, 242, 234, 0.1); }

  /* 背景の光エフェクト */
  .light-effects { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; opacity: 0; transition: opacity 0.6s ease-out; }
  .light-effects.active { opacity: 1; transition: opacity 0.3s ease-in; }
  .light-orb { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform, opacity; }
  .orb-1 { width: 500px; height: 500px; background: #d97706; top: -10%; left: -5%; animation: drift-1 6s ease-in-out infinite; }
  .orb-2 { width: 400px; height: 400px; background: #ef4444; top: 30%; right: -10%; animation: drift-2 7s ease-in-out infinite; }
  .orb-3 { width: 350px; height: 350px; background: #a855f7; bottom: 10%; left: 20%; animation: drift-3 8s ease-in-out infinite; }
  .orb-4 { width: 300px; height: 300px; background: #22c55e; top: 60%; left: 60%; animation: drift-4 9s ease-in-out infinite; }
  .orb-5 { width: 250px; height: 250px; background: #3b82f6; top: 5%; right: 30%; animation: drift-5 5s ease-in-out infinite; }
  @keyframes drift-1 { 0%, 100% { transform: translate(0, 0); opacity: 0.45; } 50% { transform: translate(220px, 120px); opacity: 0.65; } }
  @keyframes drift-2 { 0%, 100% { transform: translate(0, 0); opacity: 0.4; } 50% { transform: translate(-170px, 220px); opacity: 0.6; } }
  @keyframes drift-3 { 0%, 100% { transform: translate(0, 0); opacity: 0.5; } 50% { transform: translate(260px, -120px); opacity: 0.3; } }
  @keyframes drift-4 { 0%, 100% { transform: translate(0, 0); opacity: 0.35; } 50% { transform: translate(-210px, -200px); opacity: 0.55; } }
  @keyframes drift-5 { 0%, 100% { transform: translate(0, 0); opacity: 0.3; } 50% { transform: translate(120px, 310px); opacity: 0.45; } }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(245, 242, 234, 0.15); gap: 12px; }
  .brand { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 0.08em; }
  .brand span { color: #d97706; }
  .sub { font-size: 12px; color: rgba(245, 242, 234, 0.5); letter-spacing: 0.1em; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { background: transparent; color: #f5f2ea; border: 1px solid rgba(245, 242, 234, 0.2); width: 40px; height: 40px; border-radius: 8px; cursor: pointer; font-size: 16px; font-family: inherit; transition: all 0.2s; }
  .icon-btn:hover { background: rgba(245, 242, 234, 0.08); }
  .icon-btn.active { background: #d97706; border-color: #d97706; color: #0f0e0c; }

  .viewer-badge { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 999px; font-size: 12px; font-weight: 700; color: #ef4444; letter-spacing: 0.1em; }
  .viewer-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

  .status-bar { text-align: center; font-size: 11px; letter-spacing: 0.1em; padding: 8px 12px; margin-bottom: 16px; border-radius: 6px; text-transform: uppercase; }
  .status-bar.ok { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
  .status-bar.warn { background: rgba(234, 179, 8, 0.12); color: #eab308; }
  .status-bar.error { background: rgba(239, 68, 68, 0.12); color: #ef4444; }

  .display { background: #1a1815; border: 1px solid rgba(245, 242, 234, 0.1); border-radius: 24px; padding: 64px 24px; text-align: center; margin-bottom: 24px; min-height: 340px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .display-inner { display: flex; align-items: baseline; gap: 24px; animation: drop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .display-inner.rolling { animation: none; opacity: 0.9; }
  .display-inner.rolling .letter, .display-inner.rolling .number { transform: scale(0.95); transition: none; }
  .display.animating { box-shadow: inset 0 0 0 2px rgba(217, 119, 6, 0.4); transition: box-shadow 0.2s; }
  @keyframes drop {
    0% { transform: translateY(-40px) scale(0.7); opacity: 0; }
    60% { transform: translateY(8px) scale(1.05); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .letter { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: clamp(80px, 14vw, 180px); line-height: 1; }
  .letter.c-B { color: #3b82f6; }
  .letter.c-I { color: #ef4444; }
  .letter.c-N { color: #22c55e; }
  .letter.c-G { color: #eab308; }
  .letter.c-O { color: #a855f7; }
  .dash { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: clamp(48px, 8vw, 90px); color: rgba(245, 242, 234, 0.3); }
  .number { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: clamp(120px, 22vw, 280px); line-height: 1; color: #f5f2ea; }
  .placeholder { font-size: 18px; color: rgba(245, 242, 234, 0.4); letter-spacing: 0.05em; }
  .placeholder strong { color: #d97706; font-weight: 700; }

  .controls { display: flex; gap: 12px; margin-bottom: 32px; }
  .btn-draw { flex: 1; background: #d97706; color: #0f0e0c; border: none; border-radius: 12px; font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.05em; padding: 20px; cursor: pointer; transition: all 0.15s; }
  .btn-draw:hover:not(:disabled) { background: #ea8a1a; transform: translateY(-1px); }
  .btn-draw:active:not(:disabled) { transform: translateY(0); }
  .btn-draw:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-reset { background: transparent; color: #f5f2ea; border: 1px solid rgba(245, 242, 234, 0.25); border-radius: 12px; font-family: inherit; font-weight: 500; font-size: 14px; padding: 0 28px; cursor: pointer; transition: all 0.2s; }
  .btn-reset:hover { background: rgba(245, 242, 234, 0.08); }

  .section-label { font-size: 11px; color: rgba(245, 242, 234, 0.5); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px; }
  .ranges { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 32px; }
  .range { background: #1a1815; border: 1px solid rgba(245, 242, 234, 0.1); border-radius: 12px; padding: 16px 8px; text-align: center; cursor: pointer; transition: all 0.2s; user-select: none; }
  .range:hover { border-color: rgba(245, 242, 234, 0.3); }
  .range.off { opacity: 0.3; }
  .range-letter { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 28px; margin-bottom: 4px; }
  .range.c-B .range-letter { color: #3b82f6; }
  .range.c-I .range-letter { color: #ef4444; }
  .range.c-N .range-letter { color: #22c55e; }
  .range.c-G .range-letter { color: #eab308; }
  .range.c-O .range-letter { color: #a855f7; }
  .range-span { font-size: 11px; color: rgba(245, 242, 234, 0.6); letter-spacing: 0.03em; }
  .range-remaining { font-size: 11px; color: rgba(245, 242, 234, 0.4); margin-top: 4px; }

  .stats { display: flex; justify-content: space-between; font-size: 12px; color: rgba(245, 242, 234, 0.5); letter-spacing: 0.05em; margin-bottom: 12px; }
  .stats strong { color: #f5f2ea; font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; margin-bottom: 24px; }
  .cell { aspect-ratio: 1; background: #1a1815; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: "Unbounded", sans-serif; font-size: clamp(10px, 1.3vw, 14px); font-weight: 400; color: rgba(245, 242, 234, 0.25); border: 1px solid rgba(245, 242, 234, 0.05); transition: all 0.2s; }
  .cell.called { background: #2a2620; color: rgba(245, 242, 234, 0.65); font-weight: 700; border-color: rgba(245, 242, 234, 0.1); }
  .cell.latest { background: #d97706; color: #0f0e0c; font-weight: 900; border-color: #d97706; transform: scale(1.1); box-shadow: 0 0 16px rgba(217, 119, 6, 0.5); }
  .cell.latest.just-landed { animation: cell-light-up 0.9s cubic-bezier(0.34, 1.3, 0.64, 1) both, cell-pulse 2.5s ease-in-out 0.9s infinite; }
  @keyframes cell-light-up {
    0% { transform: scale(1); box-shadow: 0 0 0 rgba(217, 119, 6, 0); background: #2a2620; border-color: rgba(245, 242, 234, 0.1); }
    35% { transform: scale(1.55); box-shadow: 0 0 50px rgba(255, 184, 77, 1), 0 0 100px rgba(217, 119, 6, 0.6); background: #ffcc66; border-color: #ffcc66; }
    70% { transform: scale(1.05); box-shadow: 0 0 14px rgba(217, 119, 6, 0.4); background: #d97706; border-color: #d97706; }
    100% { transform: scale(1.1); box-shadow: 0 0 16px rgba(217, 119, 6, 0.5); background: #d97706; border-color: #d97706; }
  }
  @keyframes cell-pulse {
    0%, 100% { box-shadow: 0 0 16px rgba(217, 119, 6, 0.5); transform: scale(1.1); }
    50% { box-shadow: 0 0 28px rgba(217, 119, 6, 0.9); transform: scale(1.14); }
  }

  .history { background: #1a1815; border: 1px solid rgba(245, 242, 234, 0.08); border-radius: 12px; padding: 16px 20px; font-size: 13px; color: rgba(245, 242, 234, 0.7); line-height: 1.8; min-height: 48px; word-break: break-all; }
  .history-item { font-family: "Unbounded", sans-serif; font-weight: 700; margin-right: 6px; }
  .history-item.B { color: #3b82f6; }
  .history-item.I { color: #ef4444; }
  .history-item.N { color: #22c55e; }
  .history-item.G { color: #eab308; }
  .history-item.O { color: #a855f7; }

  .footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid rgba(245, 242, 234, 0.08); font-size: 11px; color: rgba(245, 242, 234, 0.3); letter-spacing: 0.05em; text-align: center; }
  .kbd { display: inline-block; padding: 2px 8px; background: rgba(245, 242, 234, 0.08); border: 1px solid rgba(245, 242, 234, 0.15); border-radius: 4px; font-family: "Unbounded", sans-serif; font-size: 10px; margin: 0 2px; }

  /* Auth modal */
  .auth-modal { position: fixed; inset: 0; background: #0f0e0c; display: none; align-items: center; justify-content: center; z-index: 200; padding: 24px; }
  .auth-modal.open { display: flex; }
  .auth-content { max-width: 360px; width: 100%; background: #1a1815; border: 1px solid rgba(245, 242, 234, 0.15); border-radius: 20px; padding: 40px 32px; text-align: center; }
  .auth-brand { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 0.08em; margin-bottom: 8px; }
  .auth-brand span { color: #d97706; }
  .auth-title { font-size: 12px; color: rgba(245, 242, 234, 0.5); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 32px; }
  #authInput { width: 100%; padding: 14px 16px; background: #0f0e0c; border: 1px solid rgba(245, 242, 234, 0.15); border-radius: 10px; color: #f5f2ea; font-size: 15px; font-family: inherit; margin-bottom: 12px; }
  #authInput:focus { outline: none; border-color: #d97706; }
  #authError { color: #ef4444; font-size: 12px; margin-bottom: 12px; min-height: 16px; }
  .auth-actions { display: flex; flex-direction: column; gap: 8px; }
  .auth-actions button { padding: 14px; border-radius: 10px; font-family: inherit; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .auth-actions button.primary { background: #d97706; color: #0f0e0c; border: 1px solid #d97706; font-weight: 700; font-family: "Unbounded", sans-serif; letter-spacing: 0.05em; }
  .auth-actions button.primary:hover { background: #ea8a1a; }
  .auth-actions button.secondary { background: transparent; color: rgba(245, 242, 234, 0.6); border: 1px solid rgba(245, 242, 234, 0.15); }
  .auth-actions button.secondary:hover { background: rgba(245, 242, 234, 0.05); color: #f5f2ea; }

  /* QR Modal */
  .qr-modal { position: fixed; inset: 0; background: rgba(15, 14, 12, 0.92); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .qr-modal.open { display: flex; }
  .qr-content { background: #1a1815; border: 1px solid rgba(245, 242, 234, 0.15); border-radius: 20px; padding: 32px; text-align: center; max-width: 400px; width: 100%; }
  .qr-title { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 8px; letter-spacing: 0.05em; color: #d97706; }
  .qr-subtitle { font-size: 12px; color: rgba(245, 242, 234, 0.6); margin-bottom: 20px; }
  #qrcode { background: #f5f2ea; padding: 16px; border-radius: 12px; display: inline-block; margin-bottom: 16px; }
  #qrcode img { display: block; }
  .qr-url { font-size: 11px; color: rgba(245, 242, 234, 0.7); word-break: break-all; font-family: ui-monospace, "SF Mono", Menlo, monospace; margin-bottom: 16px; padding: 10px; background: rgba(245, 242, 234, 0.04); border-radius: 6px; text-align: left; }
  .qr-actions { display: flex; gap: 8px; }
  .qr-actions button { flex: 1; padding: 12px; }

  @media (max-width: 640px) {
    body { padding: 16px; }
    header { flex-wrap: wrap; }
    .display { padding: 40px 16px; min-height: 260px; }
    .display-inner { gap: 12px; }
    .ranges { gap: 6px; }
    .range { padding: 12px 4px; }
    .range-letter { font-size: 22px; }
    .grid { grid-template-columns: repeat(10, 1fr); }
  }
  /* Quiz modal */
  .quiz-modal { position: fixed; inset: 0; background: rgba(15, 14, 12, 0.95); display: none; align-items: center; justify-content: center; z-index: 150; padding: 24px; }
  .quiz-modal.open { display: flex; }
  .quiz-content { background: #1a1815; border: 1px solid rgba(245, 242, 234, 0.15); border-radius: 20px; padding: 32px; max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(245, 242, 234, 0.1); }
  .quiz-number { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 16px; color: #d97706; letter-spacing: 0.1em; }
  .quiz-total { font-size: 12px; color: rgba(245, 242, 234, 0.5); letter-spacing: 0.05em; }
  .quiz-question { font-size: 22px; font-weight: 500; line-height: 1.5; margin-bottom: 28px; color: #f5f2ea; }
  .quiz-options { list-style: none; padding: 0; margin: 0 0 20px; display: flex; flex-direction: column; gap: 10px; }
  .quiz-option { padding: 16px 20px; background: #0f0e0c; border: 1px solid rgba(245, 242, 234, 0.12); border-radius: 10px; font-size: 16px; display: flex; align-items: center; gap: 14px; transition: all 0.25s; }
  .quiz-option-num { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 13px; color: rgba(245, 242, 234, 0.5); min-width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(245, 242, 234, 0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .quiz-option.correct { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; color: #f5f2ea; }
  .quiz-option.correct .quiz-option-num { background: #22c55e; color: #0f0e0c; border-color: #22c55e; }
  .quiz-hint { font-size: 13px; color: rgba(245, 242, 234, 0.85); line-height: 1.6; padding: 14px 18px; background: rgba(217, 119, 6, 0.1); border-left: 3px solid #d97706; border-radius: 0 8px 8px 0; margin-bottom: 20px; display: none; }
  .quiz-hint.show { display: block; }
  .quiz-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .quiz-actions button { flex: 1; min-width: 100px; padding: 14px; border-radius: 10px; font-family: inherit; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .quiz-actions button.primary { background: #d97706; color: #0f0e0c; border: none; font-weight: 700; }
  .quiz-actions button.primary:hover { background: #ea8a1a; }
  .quiz-actions button.secondary { background: transparent; color: #f5f2ea; border: 1px solid rgba(245, 242, 234, 0.2); }
  .quiz-actions button.secondary:hover { background: rgba(245, 242, 234, 0.08); }

  :fullscreen body { padding: 32px; }
  :fullscreen .display { min-height: 60vh; }
</style>
</head>
<body>

<!-- 背景の光エフェクト(ルーレット中に発光) -->
<div class="light-effects" id="lightEffects">
  <div class="light-orb orb-1"></div>
  <div class="light-orb orb-2"></div>
  <div class="light-orb orb-3"></div>
  <div class="light-orb orb-4"></div>
  <div class="light-orb orb-5"></div>
</div>

<!-- 認証モーダル(初期は非表示、必要時のみ表示) -->
<div class="auth-modal" id="authModal">
  <div class="auth-content">
    <div class="auth-brand">楽SAKE <span>BINGO</span></div>
    <div class="auth-title">管理者ログイン</div>
    <input type="password" id="authInput" placeholder="パスワード" autocomplete="off">
    <div id="authError"></div>
    <div class="auth-actions">
      <button class="primary" id="authSubmit">ログイン</button>
      <button class="secondary" id="authViewer">観戦モードで見る</button>
    </div>
  </div>
</div>

<!-- メインUI(初期は非表示、認証後または観戦モードで表示) -->
<div class="app hidden" id="appRoot">
  <header>
    <div>
      <div class="brand">楽SAKE <span>BINGO</span></div>
      <div class="sub" id="modeSub">BINGO CALLER</div>
    </div>
    <div class="header-actions host-only">
      <button class="icon-btn" id="quizBtn" title="クイズ(Q)">?</button>
      <button class="icon-btn" id="qrBtn" title="参加者QR">⚏</button>
      <button class="icon-btn" id="soundBtn" title="効果音">♪</button>
      <button class="icon-btn" id="fullscreenBtn" title="フルスクリーン">⛶</button>
      <button class="icon-btn" id="logoutBtn" title="ログアウト">⎋</button>
    </div>
    <div id="viewerBadgeWrap" style="display:none;">
      <div class="viewer-badge"><span class="viewer-dot"></span>LIVE観戦</div>
    </div>
  </header>

  <div id="statusBar"></div>

  <div class="display" id="display">
    <div class="placeholder"><strong>「番号を引く」</strong>ボタン または スペースキーで開始</div>
  </div>

  <div class="controls host-only">
    <button class="btn-draw" id="drawBtn">番号を引く</button>
    <button class="btn-reset" id="resetBtn">リセット</button>
  </div>

  <div>
    <div class="section-label" id="rangesLabel">出題範囲 — タップで切り替え</div>
    <div class="ranges" id="ranges"></div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>

  <div class="section-label">出題履歴</div>
  <div class="history" id="history">まだ1つも引かれていません</div>

  <div class="footer host-only">
    <span class="kbd">SPACE</span> 抽選
    <span class="kbd">R</span> リセット
    <span class="kbd">Q</span> クイズ
    <span class="kbd">F</span> フルスクリーン
  </div>
</div>

<div class="qr-modal" id="qrModal">
  <div class="qr-content">
    <div class="qr-title">参加者用QRコード</div>
    <div class="qr-subtitle">スマホで読み取ると観戦画面が開きます</div>
    <div id="qrcode"></div>
    <div class="qr-url" id="viewerUrl"></div>
    <div class="qr-actions">
      <button class="btn-reset" id="copyUrlBtn">URLをコピー</button>
      <button class="btn-reset" id="closeQrBtn">閉じる</button>
    </div>
  </div>
</div>

<div class="quiz-modal" id="quizModal">
  <div class="quiz-content">
    <div class="quiz-header">
      <div class="quiz-number" id="quizNumber">Q 1</div>
      <div class="quiz-total" id="quizTotal">全30問中</div>
    </div>
    <div class="quiz-question" id="quizQuestion"></div>
    <ul class="quiz-options" id="quizOptions"></ul>
    <div class="quiz-hint" id="quizHint"></div>
    <div class="quiz-actions host-only">
      <button class="primary" id="quizRevealBtn">答えを表示</button>
      <button class="secondary" id="quizNextBtn">別の問題</button>
      <button class="secondary" id="quizCloseBtn">閉じる</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ============================================================

function isAdminAuthed() {
  return localStorage.getItem(AUTH_KEY) === ADMIN_PASSWORD;
}

function showAuthModal() {
  const modal = document.getElementById("authModal");
  const input = document.getElementById("authInput");
  const error = document.getElementById("authError");
  const submitBtn = document.getElementById("authSubmit");
  const viewerBtn = document.getElementById("authViewer");
  modal.classList.add("open");
  setTimeout(() => input.focus(), 100);

  function tryLogin() {
    if (input.value === ADMIN_PASSWORD) {
      localStorage.setItem(AUTH_KEY, ADMIN_PASSWORD);
      modal.classList.remove("open");
      document.getElementById("appRoot").classList.remove("hidden");
      startApp();
    } else {
      error.textContent = "パスワードが違います";
      input.value = "";
      input.focus();
    }
  }
  submitBtn.addEventListener("click", tryLogin);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); tryLogin(); }
  });
  viewerBtn.addEventListener("click", () => {
    location.href = location.pathname + "?view";
  });
}

// ============================================================
// メインアプリ本体
// ============================================================
function startApp() {
  if (VIEW_MODE) {
    document.body.classList.add("view-mode");
    document.getElementById("modeSub").textContent = "VIEWER";
    document.getElementById("viewerBadgeWrap").style.display = "block";
    document.getElementById("rangesLabel").textContent = "出題範囲";
  }

  const ranges = [
    { letter: "B", min: 1, max: 15 },
    { letter: "I", min: 16, max: 30 },
    { letter: "N", min: 31, max: 45 },
    { letter: "G", min: 46, max: 60 },
    { letter: "O", min: 61, max: 75 }
  ];
  const state = {
    enabled: { B: true, I: true, N: true, G: true, O: true },
    called: new Set(),
    history: [],
    latest: null,
    sound: false,
    quiz: null,
    usedQuizzes: new Set()
  };
  let gameRef = null;

  function letterOf(n) {
    if (n <= 15) return "B";
    if (n <= 30) return "I";
    if (n <= 45) return "N";
    if (n <= 60) return "G";
    return "O";
  }
  function available() {
    const out = [];
    ranges.forEach(r => {
      if (!state.enabled[r.letter]) return;
      for (let i = r.min; i <= r.max; i++) if (!state.called.has(i)) out.push(i);
    });
    return out;
  }
  function remainingIn(letter) {
    const r = ranges.find(x => x.letter === letter);
    let c = 0;
    for (let i = r.min; i <= r.max; i++) if (!state.called.has(i)) c++;
    return c;
  }

  function showStatus(type, msg) {
    const el = document.getElementById("statusBar");
    el.className = "status-bar " + type;
    el.textContent = msg;
  }

  if (HAS_FIREBASE) {
    try {
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      gameRef = ref(db, "game/current");

      if (VIEW_MODE) {
        onValue(gameRef, (snap) => {
          const data = snap.val();
          if (data) {
            state.enabled = data.enabled || state.enabled;
            state.called = new Set(data.called || []);
            state.history = data.history || [];
            state.latest = (typeof data.latest === "number") ? data.latest : null;
            state.quiz = data.quiz || null;
            state.usedQuizzes = new Set(data.usedQuizzes || []);
          } else {
            state.called = new Set(); state.history = []; state.latest = null;
            state.quiz = null;
          }
          renderAll();
        }, (err) => { showStatus("error", "同期エラー: " + err.message); });
        showStatus("ok", "ホストと同期中");
      } else {
        get(gameRef).then(snap => {
          const data = snap.val();
          if (data) {
            state.enabled = data.enabled || state.enabled;
            state.called = new Set(data.called || []);
            state.history = data.history || [];
            state.latest = (typeof data.latest === "number") ? data.latest : null;
            state.quiz = data.quiz || null;
            state.usedQuizzes = new Set(data.usedQuizzes || []);
            // 安全装置:全範囲OFFなら全ONに戻す
            const anyEnabled = Object.values(state.enabled).some(Boolean);
            if (!anyEnabled) {
              state.enabled = { B: true, I: true, N: true, G: true, O: true };
              syncToFirebase();
            }
            renderAll();
          }
        }).catch(err => console.error("Initial load error:", err));
        showStatus("ok", "接続中 — 参加者と同期");
      }
    } catch (e) {
      showStatus("error", "Firebase初期化エラー: " + e.message);
      console.error(e);
    }
  } else {
    if (VIEW_MODE) showStatus("error", "Firebase設定が必要です");
    else showStatus("warn", "ローカルモード(参加者同期なし)");
  }

  function syncToFirebase() {
    if (!gameRef || VIEW_MODE) return;
    set(gameRef, {
      enabled: state.enabled,
      called: Array.from(state.called),
      history: state.history,
      latest: state.latest,
      quiz: state.quiz,
      usedQuizzes: Array.from(state.usedQuizzes),
      updatedAt: Date.now()
    }).catch(err => {
      console.error("Sync error:", err);
      showStatus("error", "同期エラー: " + err.message);
    });
  }

  let displayedLatest = null;
  let justResumed = true;
  let animationInProgress = false;
  let animationTimer = null;

  function showFinalNumber(n) {
    const el = document.getElementById("display");
    const L = letterOf(n);
    el.classList.remove("animating");
    el.innerHTML = '<div class="display-inner"><span class="letter c-' + L + '">' + L + '</span><span class="dash">/</span><span class="number">' + n + '</span></div>';
  }

  function showRollingNumber(n) {
    const el = document.getElementById("display");
    const L = letterOf(n);
    el.classList.add("animating");
    el.innerHTML = '<div class="display-inner rolling"><span class="letter c-' + L + '">' + L + '</span><span class="dash">/</span><span class="number">' + n + '</span></div>';
  }

  function animateDraw(finalNumber) {
    animationInProgress = true;
    const lightEffects = document.getElementById("lightEffects");
    if (lightEffects) lightEffects.classList.add("active");
    const drawBtn = document.getElementById("drawBtn");
    if (drawBtn) drawBtn.disabled = true;
    const duration = 2500;
    const startTime = performance.now();

    function tick() {
      const elapsed = performance.now() - startTime;
      if (elapsed >= duration) {
        showFinalNumber(finalNumber);
        displayedLatest = finalNumber;
        animationInProgress = false;
        animationTimer = null;
        renderGrid();
        const landedCell = document.querySelector('.cell[data-n="' + finalNumber + '"]');
        if (landedCell) landedCell.classList.add("just-landed");
        if (state.sound) playChime();
        if (drawBtn) drawBtn.disabled = available().length === 0;
        setTimeout(() => {
          if (lightEffects) lightEffects.classList.remove("active");
        }, 600);
        return;
      }
      const randN = 1 + Math.floor(Math.random() * 75);
      showRollingNumber(randN);
      const progress = elapsed / duration;
      const delay = 40 + 350 * progress * progress * progress;
      animationTimer = setTimeout(tick, delay);
    }
    tick();
  }

  function renderDisplay() {
    const el = document.getElementById("display");
    if (state.latest === null) {
      if (animationTimer) { clearTimeout(animationTimer); animationTimer = null; }
      animationInProgress = false;
      displayedLatest = null;
      el.classList.remove("animating");
      const msg = VIEW_MODE ? "ホストが番号を引くのを待っています..." : '<strong>「番号を引く」</strong>ボタン または スペースキーで開始';
      el.innerHTML = '<div class="placeholder">' + msg + '</div>';
      return;
    }
    if (state.latest === displayedLatest) return;
    if (justResumed) {
      showFinalNumber(state.latest);
      displayedLatest = state.latest;
      justResumed = false;
      return;
    }
    if (!animationInProgress) {
      animateDraw(state.latest);
    }
  }
  function renderRanges() {
    const el = document.getElementById("ranges");
    el.innerHTML = ranges.map(r => {
      const on = state.enabled[r.letter];
      return '<div class="range c-' + r.letter + (on ? "" : " off") + '" data-letter="' + r.letter + '"><div class="range-letter">' + r.letter + '</div><div class="range-span">' + r.min + "〜" + r.max + '</div><div class="range-remaining">残 ' + remainingIn(r.letter) + '</div></div>';
    }).join("");
    el.querySelectorAll(".range").forEach(node => {
      node.addEventListener("click", () => {
        if (VIEW_MODE) return;
        state.enabled[node.dataset.letter] = !state.enabled[node.dataset.letter];
        renderAll();
        syncToFirebase();
      });
    });
  }
  function renderGrid() {
    const el = document.getElementById("grid");
    let html = "";
    for (let i = 1; i <= 75; i++) {
      let cls = "cell";
      if (i === displayedLatest) cls += " latest";
      else if (state.called.has(i) && !(animationInProgress && i === state.latest)) cls += " called";
      html += '<div class="' + cls + '" data-n="' + i + '">' + i + '</div>';
    }
    el.innerHTML = html;
  }
  function renderStats() {
    const enabledCount = Object.values(state.enabled).filter(Boolean).length;
    const remaining = available().length;
    document.getElementById("stats").innerHTML = '<span>出題済み <strong>' + state.called.size + ' / 75</strong></span><span>有効範囲 <strong>' + enabledCount + '列</strong> / 残 <strong>' + remaining + '</strong> 個</span>';
  }
  function renderHistory() {
    const el = document.getElementById("history");
    if (state.history.length === 0) { el.textContent = "まだ1つも引かれていません"; return; }
    el.innerHTML = state.history.map(n => {
      const L = letterOf(n);
      return '<span class="history-item ' + L + '">' + L + '-' + n + '</span>';
    }).join("");
  }
  function renderAll() {
    renderDisplay(); renderRanges(); renderGrid(); renderStats(); renderHistory(); renderQuiz();
    const drawBtn = document.getElementById("drawBtn");
    if (drawBtn) drawBtn.disabled = available().length === 0;
  }

  // クイズ関連
  function renderQuiz() {
    const modal = document.getElementById("quizModal");
    if (!state.quiz) { modal.classList.remove("open"); return; }
    const q = QUIZ_QUESTIONS[state.quiz.index];
    if (!q) { modal.classList.remove("open"); return; }
    document.getElementById("quizNumber").textContent = "Q " + (state.quiz.index + 1);
    document.getElementById("quizTotal").textContent = "全" + QUIZ_QUESTIONS.length + "問中";
    document.getElementById("quizQuestion").textContent = q.q;
    const optsEl = document.getElementById("quizOptions");
    const numLabels = ["①", "②", "③", "④"];
    if (VIEW_MODE) {
      // 参加者側:選択肢は非表示。答え表示後は正解のみハイライトで表示
      if (state.quiz.showAnswer) {
        optsEl.innerHTML = '<li class="quiz-option correct"><span class="quiz-option-num">' + numLabels[q.answer] + '</span>' + q.options[q.answer] + '</li>';
      } else {
        optsEl.innerHTML = '';
      }
    } else {
      // ホスト側:常に全選択肢を表示
      optsEl.innerHTML = q.options.map((opt, i) => {
        const isCorrect = state.quiz.showAnswer && i === q.answer;
        return '<li class="quiz-option' + (isCorrect ? ' correct' : '') + '"><span class="quiz-option-num">' + numLabels[i] + '</span>' + opt + '</li>';
      }).join('');
    }
    const hintEl = document.getElementById("quizHint");
    if (state.quiz.showAnswer && q.hint) {
      hintEl.textContent = "💡 " + q.hint;
      hintEl.classList.add("show");
    } else {
      hintEl.classList.remove("show");
      hintEl.textContent = "";
    }
    const revealBtn = document.getElementById("quizRevealBtn");
    if (revealBtn) revealBtn.textContent = state.quiz.showAnswer ? "答えを隠す" : "答えを表示";
    modal.classList.add("open");
  }

  function showQuiz() {
    if (VIEW_MODE) return;
    nextQuestion();
  }
  function nextQuestion() {
    if (VIEW_MODE) return;
    if (state.usedQuizzes.size >= QUIZ_QUESTIONS.length) state.usedQuizzes = new Set();
    const candidates = [];
    for (let i = 0; i < QUIZ_QUESTIONS.length; i++) {
      if (!state.usedQuizzes.has(i)) candidates.push(i);
    }
    const idx = candidates[Math.floor(Math.random() * candidates.length)];
    state.usedQuizzes.add(idx);
    state.quiz = { index: idx, showAnswer: false };
    renderQuiz();
    syncToFirebase();
  }
  function toggleAnswer() {
    if (VIEW_MODE || !state.quiz) return;
    state.quiz.showAnswer = !state.quiz.showAnswer;
    renderQuiz();
    syncToFirebase();
  }
  function closeQuiz() {
    if (VIEW_MODE) return;
    state.quiz = null;
    renderQuiz();
    syncToFirebase();
  }

  function playChime() {
    if (!state.sound) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now + i * 0.08);
        gain.gain.linearRampToValueAtTime(0.15, now + i * 0.08 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.4);
      });
      setTimeout(() => ctx.close(), 800);
    } catch (e) {}
  }

  function draw() {
    if (VIEW_MODE) return;
    if (animationInProgress) return;
    const av = available();
    if (av.length === 0) return;
    const pick = av[Math.floor(Math.random() * av.length)];
    state.called.add(pick);
    state.history.push(pick);
    state.latest = pick;
    renderAll();
    syncToFirebase();
  }

  let resetArmed = false;
  let resetTimer = null;
  function reset() {
    if (VIEW_MODE) return;
    const btn = document.getElementById("resetBtn");
    if (state.history.length === 0) {
      state.called.clear(); state.history = []; state.latest = null;
      state.enabled = { B: true, I: true, N: true, G: true, O: true };
      renderAll(); syncToFirebase(); return;
    }
    if (!resetArmed) {
      resetArmed = true;
      btn.textContent = "もう一度押して確定";
      btn.style.background = "#ef4444";
      btn.style.color = "#fff";
      btn.style.borderColor = "#ef4444";
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        resetArmed = false;
        btn.textContent = "リセット";
        btn.style.background = ""; btn.style.color = ""; btn.style.borderColor = "";
      }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    btn.textContent = "リセット";
    btn.style.background = ""; btn.style.color = ""; btn.style.borderColor = "";
    state.called.clear(); state.history = []; state.latest = null;
    state.enabled = { B: true, I: true, N: true, G: true, O: true };
    renderAll(); syncToFirebase();
  }

  function toggleSound() {
    state.sound = !state.sound;
    document.getElementById("soundBtn").classList.toggle("active", state.sound);
  }
  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }
  function logout() {
    if (!confirm("管理者からログアウトしますか?このブラウザで再度操作するにはパスワードが必要になります。")) return;
    localStorage.removeItem(AUTH_KEY);
    location.reload();
  }

  function showQR() {
    const viewerUrl = location.origin + location.pathname + "?view";
    const container = document.getElementById("qrcode");
    container.innerHTML = "";
    if (window.QRCode) {
      new window.QRCode(container, {
        text: viewerUrl, width: 240, height: 240,
        colorDark: "#0f0e0c", colorLight: "#f5f2ea",
        correctLevel: window.QRCode.CorrectLevel.M
      });
    }
    document.getElementById("viewerUrl").textContent = viewerUrl;
    document.getElementById("qrModal").classList.add("open");
  }
  function hideQR() { document.getElementById("qrModal").classList.remove("open"); }
  function copyUrl() {
    const url = document.getElementById("viewerUrl").textContent;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById("copyUrlBtn");
      const original = btn.textContent;
      btn.textContent = "コピーしました";
      setTimeout(() => { btn.textContent = original; }, 1500);
    });
  }

  if (!VIEW_MODE) {
    document.getElementById("drawBtn").addEventListener("click", draw);
    document.getElementById("resetBtn").addEventListener("click", reset);
    document.getElementById("soundBtn").addEventListener("click", toggleSound);
    document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("qrBtn").addEventListener("click", showQR);
    document.getElementById("closeQrBtn").addEventListener("click", hideQR);
    document.getElementById("copyUrlBtn").addEventListener("click", copyUrl);
    document.getElementById("qrModal").addEventListener("click", (e) => { if (e.target.id === "qrModal") hideQR(); });
    document.getElementById("quizBtn").addEventListener("click", showQuiz);
    document.getElementById("quizRevealBtn").addEventListener("click", toggleAnswer);
    document.getElementById("quizNextBtn").addEventListener("click", nextQuestion);
    document.getElementById("quizCloseBtn").addEventListener("click", closeQuiz);
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.code === "Space") { e.preventDefault(); draw(); }
      else if (e.key === "r" || e.key === "R") reset();
      else if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === "q" || e.key === "Q") showQuiz();
      else if (e.key === "Escape") { hideQR(); closeQuiz(); }
    });
  } else {
    document.addEventListener("click", () => {
      if (!state.sound) state.sound = true;
    }, { once: true });
  }

  renderAll();
}

// ============================================================
// 起動処理
// ============================================================
if (VIEW_MODE || isAdminAuthed()) {
  document.getElementById("appRoot").classList.remove("hidden");
  startApp();
} else {
  showAuthModal();
}
</script>
</body>
</html>
