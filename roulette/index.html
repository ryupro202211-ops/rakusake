<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ロシアン餃子ルーレット | 楽SAKEターミナル</title>
<meta name="description" content="餃子会のロシアン餃子ルーレット。人数に応じて抽選範囲を可変設定できます。" />
<meta property="og:title" content="ロシアン餃子ルーレット | 楽SAKEターミナル" />
<meta property="og:description" content="餃子会のロシアン餃子ルーレット" />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Shippori+Mincho+B1:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0204;
    font-family: "Zen Kaku Gothic New", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes pulse-glow {
    0%, 100% {
      transform: scale(1);
      text-shadow: 0 0 40px rgba(212, 165, 116, 0.7), 0 0 80px rgba(199, 62, 58, 0.5);
    }
    50% {
      transform: scale(1.06);
      text-shadow: 0 0 60px rgba(212, 165, 116, 1), 0 0 120px rgba(199, 62, 58, 0.7);
    }
  }
  @keyframes confetti-fall {
    0% { transform: translate(0, -10px) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), 380px) rotate(720deg); opacity: 0; }
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.7; }
  }
  @keyframes spin-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-1px); }
    75% { transform: translateX(1px); }
  }
  .result-glow { animation: pulse-glow 1.8s ease-in-out infinite; }
  .spin-shake { animation: spin-shake 0.08s linear infinite; }
  .vintage-frame {
    background: linear-gradient(135deg, #2a0a0f 0%, #3a0d14 50%, #2a0a0f 100%);
    box-shadow:
      inset 0 0 0 2px #d4a574,
      inset 0 0 0 8px #2a0a0f,
      inset 0 0 0 10px #8b6332,
      0 25px 50px rgba(0,0,0,0.7),
      0 0 100px rgba(199, 62, 58, 0.25);
  }
  .gold-line {
    background: linear-gradient(90deg, transparent 0%, #d4a574 50%, transparent 100%);
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const USED_KEY = 'rakusake-roulette-used-v1';
const TOTAL_KEY = 'rakusake-roulette-total-v1';
const MIN_COUNT = 1;
const MAX_COUNT = 99;

function RussianGyozaRoulette() {
  const [used, setUsed] = useState([]);
  const [totalCount, setTotalCount] = useState(25);
  const [current, setCurrent] = useState(null);
  const [spinning, setSpinning] = useState(false);
  const [displayNum, setDisplayNum] = useState(null);
  const [showResult, setShowResult] = useState(false);
  const [loaded, setLoaded] = useState(false);

  const allNumbers = Array.from({ length: totalCount }, (_, i) => i + 1);
  const remaining = allNumbers.filter((n) => !used.includes(n));

  // 人数に応じてグリッド列数を自動調整
  const gridCols = totalCount <= 30 ? 5 : totalCount <= 49 ? 7 : totalCount <= 80 ? 8 : 10;

  // localStorage 復元
  useEffect(() => {
    try {
      const savedUsed = localStorage.getItem(USED_KEY);
      if (savedUsed) {
        const parsed = JSON.parse(savedUsed);
        if (Array.isArray(parsed)) setUsed(parsed);
      }
      const savedTotal = localStorage.getItem(TOTAL_KEY);
      if (savedTotal) {
        const n = parseInt(savedTotal, 10);
        if (n >= MIN_COUNT && n <= MAX_COUNT) setTotalCount(n);
      }
    } catch (e) {}
    setLoaded(true);
  }, []);

  // localStorage 保存 (used)
  useEffect(() => {
    if (!loaded) return;
    try {
      if (used.length === 0) {
        localStorage.removeItem(USED_KEY);
      } else {
        localStorage.setItem(USED_KEY, JSON.stringify(used));
      }
    } catch (e) {}
  }, [used, loaded]);

  // localStorage 保存 (totalCount)
  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(TOTAL_KEY, String(totalCount));
    } catch (e) {}
  }, [totalCount, loaded]);

  const changeTotalCount = (newCount) => {
    if (spinning) return;
    if (newCount < MIN_COUNT || newCount > MAX_COUNT) return;

    // 減らす方向で範囲外の既出が出る場合のみ確認
    const outOfRange = used.filter((n) => n > newCount);
    if (outOfRange.length > 0) {
      const ok = window.confirm(
        `人数を${newCount}人に減らします。\n抽選済みの ${outOfRange.join(', ')} 番が範囲外になり、履歴から削除されます。\n\n続行しますか？`
      );
      if (!ok) return;
      setUsed(used.filter((n) => n <= newCount));
      if (current !== null && current > newCount) {
        setCurrent(null);
        setDisplayNum(null);
        setShowResult(false);
      }
    }
    setTotalCount(newCount);
  };

  const spin = () => {
    if (remaining.length === 0 || spinning) return;
    setSpinning(true);
    setShowResult(false);
    setCurrent(null);

    const finalNum = remaining[Math.floor(Math.random() * remaining.length)];
    const totalDuration = 2800;
    const startTime = Date.now();

    const tick = () => {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / totalDuration, 1);

      if (progress >= 1) {
        setDisplayNum(finalNum);
        setCurrent(finalNum);
        setUsed((prev) => [...prev, finalNum]);
        setSpinning(false);
        setShowResult(true);
        return;
      }

      const randomNum = remaining[Math.floor(Math.random() * remaining.length)];
      setDisplayNum(randomNum);

      const easeOut = Math.pow(progress, 2.2);
      const nextDelay = 35 + easeOut * 320;
      setTimeout(tick, nextDelay);
    };

    tick();
  };

  const reset = () => {
    if (spinning) return;
    const ok = window.confirm('抽選履歴をリセットしますか？\n（人数設定はそのまま維持されます）');
    if (!ok) return;
    setUsed([]);
    setCurrent(null);
    setDisplayNum(null);
    setShowResult(false);
    try {
      localStorage.removeItem(USED_KEY);
    } catch (e) {}
  };

  return (
    <div
      className="min-h-screen w-full flex flex-col items-center justify-start px-4 py-6 relative overflow-hidden"
      style={{
        background: 'radial-gradient(ellipse at top, #3a0d14 0%, #1a0508 60%, #0d0204 100%)',
        fontFamily: '"Zen Kaku Gothic New", sans-serif',
      }}
    >
      {/* 装飾シマー */}
      <div
        className="absolute inset-0 pointer-events-none"
        style={{
          background:
            'radial-gradient(circle at 30% 20%, rgba(212, 165, 116, 0.1) 0%, transparent 50%), radial-gradient(circle at 70% 80%, rgba(199, 62, 58, 0.08) 0%, transparent 50%)',
          animation: 'shimmer 4s ease-in-out infinite',
        }}
      />

      {/* ヘッダー */}
      <div className="relative z-10 text-center mt-2 mb-5">
        <div
          className="text-[10px] md:text-xs tracking-[0.5em] mb-3"
          style={{ color: '#d4a574', fontFamily: '"Shippori Mincho B1", serif' }}
        >
          ✦　餃子会　✦
        </div>
        <h1
          className="text-3xl md:text-5xl font-black tracking-tight leading-tight"
          style={{
            color: '#f5e6d3',
            fontFamily: '"Shippori Mincho B1", serif',
            fontWeight: 900,
            textShadow: '0 4px 20px rgba(0,0,0,0.6)',
          }}
        >
          ロシアン餃子
          <br className="md:hidden" />
          <span style={{ color: '#c73e3a' }}>ルーレット</span>
        </h1>
        <div className="flex items-center justify-center gap-3 mt-3">
          <div className="h-px w-12 gold-line" />
          <div className="text-[10px] tracking-[0.4em]" style={{ color: '#8b6332' }}>
            RUSSIAN GYOZA
          </div>
          <div className="h-px w-12 gold-line" />
        </div>
      </div>

      {/* 人数調整コントロール */}
      <div
        className="relative z-10 flex items-center gap-3 mb-5 px-4 py-2 rounded-full"
        style={{
          background: 'rgba(42, 10, 15, 0.6)',
          border: '1px solid #4a2c30',
        }}
      >
        <span
          className="text-[11px] tracking-[0.3em]"
          style={{ color: '#8b6332', fontFamily: '"Shippori Mincho B1", serif' }}
        >
          人数
        </span>
        <button
          onClick={() => changeTotalCount(totalCount - 1)}
          disabled={spinning || totalCount <= MIN_COUNT}
          aria-label="人数を1減らす"
          className="w-8 h-8 rounded-full flex items-center justify-center transition-all disabled:opacity-30 active:scale-90"
          style={{
            background: 'transparent',
            border: '1px solid #d4a574',
            color: '#d4a574',
            fontSize: '18px',
            fontWeight: 'bold',
            lineHeight: 1,
          }}
        >
          −
        </button>
        <span
          className="text-2xl font-black text-center inline-block"
          style={{
            color: '#d4a574',
            fontFamily: '"Anton", sans-serif',
            minWidth: '2.2rem',
          }}
        >
          {totalCount}
        </span>
        <button
          onClick={() => changeTotalCount(totalCount + 1)}
          disabled={spinning || totalCount >= MAX_COUNT}
          aria-label="人数を1増やす"
          className="w-8 h-8 rounded-full flex items-center justify-center transition-all disabled:opacity-30 active:scale-90"
          style={{
            background: 'transparent',
            border: '1px solid #d4a574',
            color: '#d4a574',
            fontSize: '18px',
            fontWeight: 'bold',
            lineHeight: 1,
          }}
        >
          ＋
        </button>
        <span
          className="text-[11px] tracking-[0.3em]"
          style={{ color: '#8b6332', fontFamily: '"Shippori Mincho B1", serif' }}
        >
          人
        </span>
      </div>

      {/* メインディスプレイ */}
      <div className="relative z-10 w-full max-w-md mb-6">
        <div className="vintage-frame rounded-lg aspect-square flex flex-col items-center justify-center relative overflow-hidden">
          {/* 紙吹雪 */}
          {showResult && (
            <div className="absolute inset-0 pointer-events-none">
              {[...Array(24)].map((_, i) => (
                <div
                  key={i}
                  className="absolute"
                  style={{
                    left: '50%',
                    top: '45%',
                    width: '6px',
                    height: '10px',
                    background: ['#d4a574', '#c73e3a', '#f5e6d3', '#e8b85a'][i % 4],
                    '--tx': `${(Math.random() - 0.5) * 320}px`,
                    animation: `confetti-fall ${1.2 + Math.random() * 0.8}s ease-out ${Math.random() * 0.3}s both`,
                    transform: 'rotate(45deg)',
                  }}
                />
              ))}
            </div>
          )}

          {displayNum === null ? (
            <div className="text-center px-6">
              <div
                className="text-[120px] md:text-[140px] leading-none font-black"
                style={{
                  color: '#8b6332',
                  fontFamily: '"Anton", sans-serif',
                  letterSpacing: '-0.02em',
                }}
              >
                ?
              </div>
              <div className="text-xs tracking-[0.3em] mt-4" style={{ color: '#d4a574' }}>
                ボタンを押してスタート
              </div>
            </div>
          ) : (
            <React.Fragment>
              <div
                className={`text-[180px] md:text-[220px] leading-none font-black ${
                  showResult ? 'result-glow' : spinning ? 'spin-shake' : ''
                }`}
                style={{
                  color: showResult ? '#f5e6d3' : '#e8b85a',
                  fontFamily: '"Anton", sans-serif',
                  letterSpacing: '-0.02em',
                  transition: 'color 0.3s',
                }}
              >
                {displayNum}
              </div>
              {showResult && (
                <div
                  className="text-base tracking-[0.4em] mt-2 font-bold"
                  style={{ color: '#c73e3a', fontFamily: '"Shippori Mincho B1", serif' }}
                >
                  ＼　当　選　／
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </div>

      {/* SPINボタン */}
      <button
        onClick={spin}
        disabled={spinning || remaining.length === 0}
        className="relative z-10 px-14 py-4 rounded-full font-black text-lg tracking-[0.25em] transition-all duration-200 mb-6 disabled:opacity-40 disabled:cursor-not-allowed active:translate-y-0.5"
        style={{
          background:
            spinning || remaining.length === 0
              ? 'linear-gradient(135deg, #4a2c30 0%, #2a0a0f 100%)'
              : 'linear-gradient(135deg, #c73e3a 0%, #8b1a1a 100%)',
          color: '#f5e6d3',
          fontFamily: '"Shippori Mincho B1", serif',
          boxShadow:
            spinning || remaining.length === 0
              ? 'inset 0 2px 8px rgba(0,0,0,0.5)'
              : '0 8px 24px rgba(199, 62, 58, 0.5), inset 0 1px 0 rgba(255,255,255,0.2)',
          border: '2px solid #d4a574',
        }}
      >
        {remaining.length === 0 ? '完　了' : spinning ? '抽選中…' : 'S P I N  ▸'}
      </button>

      {/* カウンター */}
      <div className="relative z-10 mb-4 text-center flex items-baseline justify-center gap-2">
        <span className="text-xs tracking-[0.3em]" style={{ color: '#8b6332' }}>残　り</span>
        <span
          className="text-3xl font-black"
          style={{ color: '#d4a574', fontFamily: '"Anton", sans-serif' }}
        >
          {remaining.length}
        </span>
        <span className="text-xs tracking-[0.3em]" style={{ color: '#8b6332' }}>/ {totalCount}</span>
      </div>

      {/* グリッド */}
      <div
        className="relative z-10 w-full max-w-md mb-6"
        style={{
          display: 'grid',
          gridTemplateColumns: `repeat(${gridCols}, minmax(0, 1fr))`,
          gap: '6px',
        }}
      >
        {allNumbers.map((n) => {
          const isUsed = used.includes(n);
          const isCurrent = n === current;
          const fontSize = gridCols <= 5 ? '16px' : gridCols <= 7 ? '13px' : gridCols <= 8 ? '12px' : '10px';
          return (
            <div
              key={n}
              className="aspect-square flex items-center justify-center rounded font-bold transition-all"
              style={{
                background: isCurrent
                  ? 'linear-gradient(135deg, #c73e3a 0%, #8b1a1a 100%)'
                  : isUsed
                  ? '#1a0508'
                  : '#2a0a0f',
                color: isCurrent ? '#f5e6d3' : isUsed ? '#4a2c30' : '#d4a574',
                border: `1px solid ${isCurrent ? '#d4a574' : isUsed ? '#1a0508' : '#4a2c30'}`,
                fontFamily: '"Anton", sans-serif',
                fontSize: fontSize,
                textDecoration: isUsed && !isCurrent ? 'line-through' : 'none',
                boxShadow: isCurrent ? '0 0 20px rgba(199, 62, 58, 0.7)' : 'none',
              }}
            >
              {n}
            </div>
          );
        })}
      </div>

      {/* リセットボタン */}
      <button
        onClick={reset}
        disabled={spinning}
        className="relative z-10 px-6 py-2 rounded-full text-xs tracking-[0.25em] transition-all hover:opacity-100 disabled:opacity-30"
        style={{
          background: 'transparent',
          color: '#8b6332',
          border: '1px solid #4a2c30',
          fontFamily: '"Shippori Mincho B1", serif',
          opacity: 0.7,
        }}
      >
        ↻　履歴リセット
      </button>

      {/* フッター */}
      <div className="flex items-center gap-3 mt-8 mb-4">
        <div className="h-px w-8 gold-line opacity-50" />
        <div className="text-[10px] tracking-[0.3em]" style={{ color: '#4a2c30' }}>
          楽SAKE Terminal
        </div>
        <div className="h-px w-8 gold-line opacity-50" />
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<RussianGyozaRoulette />);
</script>
</body>
</html>
